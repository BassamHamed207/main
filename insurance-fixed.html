<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Insurance Approvals Hub</title>
<style>
*{box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{margin:0;padding:16px;background:#f3f2f1}
h1{font-size:20px;margin:0 0 12px}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.col{flex:1;min-width:140px}
label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:14px}
textarea{resize:vertical;min-height:60px}
.btn{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:14px}
.btn-primary{background:#0078d4;color:#fff}
.btn-secondary{background:#e1dfdd;color:#323130}
.btn:hover{opacity:.85}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:8px;padding:20px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 12px;font-size:18px}
.muted{color:#888}
.mini{max-width:200px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}
th{background:#fafafa}
.val{display:flex;align-items:center;gap:8px}
.val span{flex:1}
.hidden{display:none!important}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323130;color:#fff;padding:10px 20px;border-radius:4px;display:none;z-index:2000}
</style>
</head>
<body>

<h1>Insurance Approvals Hub</h1>

<!-- FILTERS -->
<div class="card">
<div class="row">
  <div class="col"><label>Approval Status</label>
    <select id="fltApproval"><option value="">All</option></select>
  </div>
  <div class="col"><label>From Date</label><input id="fltFrom" type="date"/></div>
  <div class="col"><label>To Date</label><input id="fltTo" type="date"/></div>
  <div class="col" style="display:flex;align-items:flex-end"><button class="btn btn-primary" id="btnSearch">Search</button></div>
</div>
</div>

<!-- GRID -->
<div class="card" style="overflow-x:auto">
<table id="grid">
<thead><tr>
  <th>Service #</th><th>Type</th><th>Patient</th><th>Provider</th><th>Status</th><th>Created</th><th></th>
</tr></thead>
<tbody></tbody>
</table>
</div>

<!-- DETAIL MODAL -->
<div class="modal-bg" id="detailModal">
<div class="modal">
  <h2>Service Detail</h2>
  <div id="detailContent"></div>
  <div class="row" style="margin-top:12px">
    <button class="btn btn-secondary" id="detailClose">Close</button>
    <button class="btn btn-primary" id="btnApprove">Approve</button>
    <button class="btn btn-secondary" id="btnAddComm">Add Communication</button>
  </div>
</div>
</div>

<!-- APPROVE MODAL -->
<div class="modal-bg" id="apprModal">
<div class="modal">
  <h2>Approve Service</h2>
  <div class="row"><div class="col"><label>Approval Method</label>
    <select id="apprMethod"><option value="">Select…</option></select>
  </div></div>
  <div class="row hidden" id="apprCorpRow"><div class="col"><label>Corporate Agent</label>
    <div class="val"><span id="apprCorpText" class="muted">Pick user…</span><button class="btn btn-secondary" id="apprPickCorp" type="button">Pick</button></div>
  </div></div>
  <div class="row" style="margin-top:12px">
    <button class="btn btn-secondary" id="apprCancel">Cancel</button>
    <button class="btn btn-primary" id="apprSave">Save</button>
  </div>
</div>
</div>

<!-- COMMUNICATION MODAL -->
<div class="modal-bg" id="commModal">
<div class="modal">
  <h2>Add Communication</h2>
  <div class="row"><div class="col"><label>Category</label>
    <select id="commCatSel"><option value="">Select…</option></select>
  </div></div>
  <div class="row"><div class="col"><label>Comment</label>
    <textarea id="commText" rows="3"></textarea>
  </div></div>
  <div class="row" style="margin-top:12px">
    <button class="btn btn-secondary" id="commCancel">Cancel</button>
    <button class="btn btn-primary" id="commSend">Send</button>
  </div>
</div>
</div>

<!-- PV SEND EMAIL MODAL -->
<div class="modal-bg" id="pvModal">
<div class="modal">
  <h2>Send Pre-Validation Email</h2>
  <div class="row"><div class="col"><label>Email To</label><input id="pvEmail" type="email"/></div></div>
  <div class="row"><div class="col"><label>Subject</label><input id="pvSubject" type="text"/></div></div>
  <div class="row"><div class="col"><label>Body</label><textarea id="pvBody" rows="4"></textarea></div></div>
  <div class="row" style="margin-top:12px">
    <button class="btn btn-secondary" id="pvCancel">Cancel</button>
    <button class="btn btn-primary" id="pvSendEmail">Send</button>
  </div>
</div>
</div>

<div id="toast"></div>

<script>
(function(){
"use strict";

/* ========== CONFIG ========== */
const CFG = {
  service: "opd_service",
  comm: "dm_depcommunication",
  commCat: "dm_validationcomment",
  fields: {
    service: {
      id: "opd_serviceid",
      name: "opd_name",
      type: "opd_servicetypename",
      patient: "opd_patientname",
      provider: "opd_providername",
      approval: "opd_approvalstatus",
      approvalMethod: "opd_approvalmethod",
      corporateAgentName: "opd_corporateagentname",
      createdOn: "createdon"
    },
    comm: {
      comment: "dm_comment"
    }
  },
  status: {
    pending: 100000000,
    approved: 100000001,
    rejected: 100000002
  },
  approvalMethods: {
    standard: 100000000,
    corporate: 100000001
  }
};

/* ========== HELPERS ========== */
function getXrm(){ return window.parent && window.parent.Xrm ? window.parent.Xrm : window.Xrm; }

const entitySetCache = {};
async function getEntitySetName(Xrm, logicalName){
  if(entitySetCache[logicalName]) return entitySetCache[logicalName];
  const meta = await Xrm.Utility.getEntityMetadata(logicalName, ["EntitySetName"]);
  entitySetCache[logicalName] = meta.EntitySetName;
  return meta.EntitySetName;
}

function toast(msg, ms){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(()=>{ t.style.display="none"; }, ms||3000);
}

function fmtDate(d){ return d ? new Date(d).toLocaleDateString() : ""; }

/* ========== OPTION SET LOADERS ========== */
async function loadOptionSet(Xrm, entity, attr, selectEl, placeholder){
  selectEl.innerHTML = `<option value="">${placeholder||"Select…"}</option>`;
  const meta = await Xrm.Utility.getEntityMetadata(entity, [attr]);
  const opts = meta.Attributes.getByName(attr).OptionSet.Options;
  opts.forEach(o=>{
    const op = document.createElement("option");
    op.value = o.Value;
    op.textContent = o.Label;
    selectEl.appendChild(op);
  });
}

async function loadLookupOptions(Xrm, entity, nameAttr, idAttr, selectEl, placeholder){
  selectEl.innerHTML = `<option value="">${placeholder||"Select…"}</option>`;
  const setName = await getEntitySetName(Xrm, entity);
  const res = await Xrm.WebApi.retrieveMultipleRecords(entity, `?$select=${nameAttr},${idAttr}`);
  res.entities.forEach(e=>{
    const op = document.createElement("option");
    op.value = e[idAttr];
    op.textContent = e[nameAttr];
    selectEl.appendChild(op);
  });
}

/* ========== GRID ========== */
let gridData = [];
let selectedService = null;
let commServiceId = null;
let apprCorpAgent = null;

async function loadGrid(){
  const Xrm = getXrm();
  const tbody = document.querySelector("#grid tbody");
  tbody.innerHTML = "<tr><td colspan='7'>Loading…</td></tr>";

  const cols = Object.values(CFG.fields.service).join(",");
  let filter = "";
  const fltApproval = document.getElementById("fltApproval").value;
  const fltFrom = document.getElementById("fltFrom").value;
  const fltTo = document.getElementById("fltTo").value;
  const filters = [];
  if(fltApproval) filters.push(`${CFG.fields.service.approval} eq ${fltApproval}`);
  if(fltFrom) filters.push(`${CFG.fields.service.createdOn} ge ${fltFrom}T00:00:00Z`);
  if(fltTo) filters.push(`${CFG.fields.service.createdOn} le ${fltTo}T23:59:59Z`);
  if(filters.length) filter = "&$filter=" + filters.join(" and ");

  const res = await Xrm.WebApi.retrieveMultipleRecords(CFG.service, `?$select=${cols}${filter}&$orderby=${CFG.fields.service.createdOn} desc`);
  gridData = res.entities;

  tbody.innerHTML = "";
  if(!gridData.length){
    tbody.innerHTML = "<tr><td colspan='7'>No records found.</td></tr>";
    return;
  }
  gridData.forEach((r,i)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r[CFG.fields.service.name]||""}</td>
      <td>${r[CFG.fields.service.type]||""}</td>
      <td>${r[CFG.fields.service.patient]||""}</td>
      <td>${r[CFG.fields.service.provider]||""}</td>
      <td>${getStatusLabel(r[CFG.fields.service.approval])}</td>
      <td>${fmtDate(r[CFG.fields.service.createdOn])}</td>
      <td><button class="btn btn-secondary btnView" data-idx="${i}">View</button></td>`;
    tbody.appendChild(tr);
  });
}

function getStatusLabel(v){
  if(v === CFG.status.approved) return "Approved";
  if(v === CFG.status.rejected) return "Rejected";
  return "Pending";
}

/* ========== EVENT LISTENERS ========== */
document.getElementById("btnSearch").addEventListener("click", loadGrid);

document.querySelector("#grid tbody").addEventListener("click", e=>{
  if(!e.target.classList.contains("btnView")) return;
  const idx = e.target.dataset.idx;
  selectedService = gridData[idx];
  showDetail();
});

function showDetail(){
  const c = document.getElementById("detailContent");
  c.innerHTML = `
    <p><strong>Service #:</strong> ${selectedService[CFG.fields.service.name]||""}</p>
    <p><strong>Type:</strong> ${selectedService[CFG.fields.service.type]||""}</p>
    <p><strong>Patient:</strong> ${selectedService[CFG.fields.service.patient]||""}</p>
    <p><strong>Provider:</strong> ${selectedService[CFG.fields.service.provider]||""}</p>
    <p><strong>Status:</strong> ${getStatusLabel(selectedService[CFG.fields.service.approval])}</p>
    <p><strong>Created:</strong> ${fmtDate(selectedService[CFG.fields.service.createdOn])}</p>`;
  document.getElementById("detailModal").style.display = "flex";
}

document.getElementById("detailClose").addEventListener("click", ()=>{
  document.getElementById("detailModal").style.display = "none";
});

/* --- APPROVE --- */
document.getElementById("btnApprove").addEventListener("click", ()=>{
  document.getElementById("detailModal").style.display = "none";
  apprCorpAgent = null;
  document.getElementById("apprCorpText").textContent = "Pick user…";
  document.getElementById("apprMethod").value = "";
  document.getElementById("apprCorpRow").classList.add("hidden");
  document.getElementById("apprModal").style.display = "flex";
});

document.getElementById("apprMethod").addEventListener("change", e=>{
  const isCorp = Number(e.target.value) === CFG.approvalMethods.corporate;
  document.getElementById("apprCorpRow").classList.toggle("hidden", !isCorp);
});

document.getElementById("apprPickCorp").addEventListener("click", async ()=>{
  const Xrm = getXrm();
  try{
    const res = await Xrm.Utility.lookupObjects({
      allowMultiSelect: false,
      defaultEntityType: "systemuser",
      entityTypes: ["systemuser"],
      searchText: "",
      lookupStyle: "single"
    });
    if(res && res.length){
      apprCorpAgent = {
        id: res[0].id.replace(/[{}]/g,""),
        name: res[0].name
      };
      document.getElementById("apprCorpText").textContent = apprCorpAgent.name;
    }
  }catch(ex){
    console.error("Lookup error", ex);
    toast("Could not open user picker");
  }
});

document.getElementById("apprCancel").addEventListener("click", ()=>{
  document.getElementById("apprModal").style.display = "none";
});

document.getElementById("apprSave").addEventListener("click", async ()=>{
  const Xrm = getXrm();
  const methodVal = document.getElementById("apprMethod").value;
  if(!methodVal){ toast("Please select approval method"); return; }

  const isCorp = Number(methodVal) === CFG.approvalMethods.corporate;
  if(isCorp && !apprCorpAgent){ toast("Please pick a corporate agent"); return; }

  try{
    const payload = {};
    payload[CFG.fields.service.approval] = Number(CFG.status.approved);
    payload[CFG.fields.service.approvalMethod] = Number(methodVal);

    if(isCorp && apprCorpAgent){
      const userSet = await getEntitySetName(Xrm, "systemuser");
      payload["opd_corporateagentname@odata.bind"] = "/" + userSet + "(" + apprCorpAgent.id + ")";
    }

    await Xrm.WebApi.updateRecord(CFG.service, selectedService[CFG.fields.service.id], payload);
    toast("Approved successfully");
    document.getElementById("apprModal").style.display = "none";
    loadGrid();
  }catch(ex){
    console.error("Approve error", ex);
    toast("Error approving: " + (ex.message||ex));
  }
});

/* --- ADD COMMUNICATION --- */
document.getElementById("btnAddComm").addEventListener("click", ()=>{
  document.getElementById("detailModal").style.display = "none";
  commServiceId = selectedService[CFG.fields.service.id];
  document.getElementById("commCatSel").value = "";
  document.getElementById("commText").value = "";
  document.getElementById("commModal").style.display = "flex";
});

document.getElementById("commCancel").addEventListener("click", ()=>{
  document.getElementById("commModal").style.display = "none";
});

document.getElementById("commSend").addEventListener("click", async ()=>{
  const Xrm = getXrm();
  const catSel = document.getElementById("commCatSel");
  const catId = catSel.value;
  const c = document.getElementById("commText").value.trim();
  if(!catId){ toast("Please select a category"); return; }
  if(!c){ toast("Please enter a comment"); return; }

  try{
    const svcSet = await getEntitySetName(Xrm, CFG.service);
    const catSet = await getEntitySetName(Xrm, CFG.commCat);
    const sid = commServiceId.replace(/[{}]/g,"");

    const payload = {};
    payload["dm_comment"] = c;
    payload["opd_Service@odata.bind"] = `/${svcSet}(${sid})`;
    payload["dm_CommentCategory@odata.bind"] = `/${catSet}(${catId.replace(/[{}]/g,"")})`;

    await Xrm.WebApi.createRecord(CFG.comm, payload);
    toast("Communication added");
    document.getElementById("commModal").style.display = "none";
  }catch(ex){
    console.error("Comm error", ex);
    toast("Error adding communication: " + (ex.message||ex));
  }
});

/* --- PV SEND EMAIL --- */
document.getElementById("pvCancel").addEventListener("click", ()=>{
  document.getElementById("pvModal").style.display = "none";
});

document.getElementById("pvSendEmail").addEventListener("click", async ()=>{
  const email = document.getElementById("pvEmail").value.trim();
  const subject = document.getElementById("pvSubject").value.trim();
  const body = document.getElementById("pvBody").value.trim();
  if(!email || !subject){ toast("Email and subject required"); return; }

  try{
    const Xrm = getXrm();
    // Construct email activity record
    const payload = {
      subject: subject,
      description: body,
      directioncode: true,
      "emailsender_account@odata.bind": null
    };
    // Additional email logic would go here based on requirements
    toast("Email functionality placeholder");
    document.getElementById("pvModal").style.display = "none";
  }catch(ex){
    console.error("Email error", ex);
    toast("Error sending email: " + (ex.message||ex));
  }
});

/* ========== INIT ========== */
async function init(){
  const Xrm = getXrm();
  if(!Xrm){
    toast("Xrm not available – run inside Dynamics");
    return;
  }
  try{
    await loadOptionSet(Xrm, CFG.service, CFG.fields.service.approval, document.getElementById("fltApproval"), "All");
    await loadOptionSet(Xrm, CFG.service, CFG.fields.service.approvalMethod, document.getElementById("apprMethod"), "Select…");
    await loadLookupOptions(Xrm, CFG.commCat, "dm_name", "dm_validationcommentid", document.getElementById("commCatSel"), "Select…");
    await loadGrid();
  }catch(ex){
    console.error("Init error", ex);
    toast("Initialization error: " + (ex.message||ex));
  }
}

init();

})();
</script>
</body>
</html>
